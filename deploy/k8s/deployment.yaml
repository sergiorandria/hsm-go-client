apiVersion: v1
kind: Secret
metadata:
  name: hsm-pin
type: Opaque
stringData:
  pin: "1234"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hsm-app
  template:
    metadata:
      labels:
        app: hsm-app
    spec:
      containers:
        - name: app
          image: ghcr.io/sergiorandria/hsm-go-client:latest
          env:
            - name: PKCS11_LIB
              value: "/usr/lib/softhsm/libsofthsm2.so"
            - name: PKCS11_TOKEN
              value: "test-token"
            - name: HSM_PIN
              valueFrom:
                secretKeyRef:
                  name: hsm-pin
                  key: pin
          ports:
            - containerPort: 8080
          livenessProbe:
            exec:
              command: ["hsm-cli", "-action", "health"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["hsm-cli", "-action", "info"]
            initialDelaySeconds: 5
            periodSeconds: 10
